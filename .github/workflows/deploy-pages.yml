name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for package.json
        id: check_package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ package.json found - will build and deploy"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  package.json not found - skipping deployment"
            echo "This workflow will deploy once the project is merged to main"
          fi
      
      - name: Setup Node.js
        if: steps.check_package.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        if: steps.check_package.outputs.exists == 'true'
        run: npm ci
      
      - name: Run TypeScript compiler
        if: steps.check_package.outputs.exists == 'true'
        run: npx tsc
      
      - name: Build with Vite
        if: steps.check_package.outputs.exists == 'true'
        run: npx vite build --base=/tatematika/
      
      - name: Setup Pages
        if: steps.check_package.outputs.exists == 'true'
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        if: steps.check_package.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        if: steps.check_package.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
